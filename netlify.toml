[build]
  publish = "public"
  functions = "netlify/functions"

# every store has its own link: /<store> is its shop. The admin is /admin for every store
# (old /<store>/admin links still open it).
# Real files (shop.js, admin.css…) are served first, so these only catch store links.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/:store/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/:store"
  to = "/store.html"
  status = 200

[dev]
  publish = "public"
  port = 8888
  autoLaunch = false
