 <div id="cat"></div>
 <h1>افتح متجرك ♡</h1>
 <p>أنشئ حساب، وأول ما تدخل وتكتب اسم محلك يصير لك رابط خاص فيه يطلبون منه عملاؤك.</p>
 <a class="btn p" href="/admin#new">أنشئ حساب جديد</a>
 <a class="btn" href="/admin">عندي حساب، دخول</a>
</div>
<div class="alt" id="main"></div>
</div></div>
<script>window.MM_LIB=true</script>
<script src="/shop.js"></script>
<script>
{
const $=s=>document.querySelector(s);
$('#cat').innerHTML=window.MM.catSVG('happy');
/* the first store, from before every store had its own link: its customers may still come here */
fetch('/api/_/home').then(r=>r.json()).then(j=>{if(!j.main)return;const a=document.createElement('a');a.href='/'+encodeURIComponent(j.main.slug);a.textContent='تبي تطلب من '+(j.main.ar||j.main.name||j.main.slug)+'؟ ادخل هنا ←';$('#main').appendChild(a)}).catch(()=>{});
}
</script>
